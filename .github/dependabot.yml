version: 2
updates:
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      dependencies:
        applies-to: version-updates
        update-types: ['major', 'minor', 'patch']
    ignore:
      - dependency-name: 'openclaw'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      actions:
        applies-to: version-updates
        update-types: ['major', 'minor', 'patch']
