name: Maintenance compatibility

on:
  pull_request:

permissions:
  contents: read

jobs:
  maintenance-compatibility:
    name: Maintenance / ${{ matrix.os }} / Bun ${{ matrix.bun }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-26
        bun:
          - '1.4.2'
          - auto
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: tanaabased/actions/setup-bun@v1
        with:
          bun-version: ${{ matrix.bun }}
      - name: Install frozen dependencies with the maintenance runtime
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Test maintenance without the development Mocha CLI
        run: bun run test:maintenance
