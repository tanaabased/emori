name: Example Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  examples:
    name: ${{ matrix.example }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        example:
          - workspace
          - agent-system-install
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up OpenClaw
        uses: tanaabased/actions/setup-openclaw@v1
        with:
          version: 2026.9.4
          agent-system: github:tanaabased/openclaw-agent-system#main
      - name: Set up Bun
        uses: tanaabased/actions/setup-bun@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run Leia-backed example
        shell: bash
        env:
          NO_COLOR: '1'
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.EMORIKEY }}
          TMPDIR: ${{ github.workspace }}/examples/${{ matrix.example }}/.tmp
        run: |
          mkdir -p "$TMPDIR"
          bun run leia "examples/${{ matrix.example }}/README.md" --retry 0
