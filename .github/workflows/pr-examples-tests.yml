name: Example Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  examples:
    name: ${{ matrix.example }}
    runs-on: macos-26
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    strategy:
      fail-fast: false
      matrix:
        # Temporarily omit setup: Gateway automation reconciliation fails after full setup.
        # Keep examples/setup/README.md assertions intact; restore coverage after repair (#110).
        example:
          - workspace
          - install
          - shared
          - backup
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up OpenClaw
        uses: tanaabased/actions/setup-openclaw@v1
        with:
          # Diagnostic candidate; restore main after the upstream fix lands.
          agent-system: github:tanaabased/openclaw-agent-system#4ea15a92979e21fc49df679276be2a7147a4f156
      - name: Set up Bun
        uses: tanaabased/actions/setup-bun@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Refresh Homebrew when needed
        shell: bash
        run: HOMEBREW_NO_AUTO_UPDATE= brew update-if-needed
      - name: Run Leia-backed example
        shell: bash
        env:
          NO_COLOR: '1'
          OP_SERVICE_ACCOUNT_TOKEN: ${{ matrix.example != 'shared' && secrets.EMORIKEY || '' }}
          TMPDIR: ${{ github.workspace }}/examples/${{ matrix.example }}/.tmp
        run: |
          mkdir -p "$TMPDIR"
          bun run leia "examples/${{ matrix.example }}/README.md" --retry 0
