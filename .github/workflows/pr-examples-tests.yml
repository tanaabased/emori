name: Example Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  examples:
    name: ${{ matrix.example }}
    runs-on: macos-26
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    strategy:
      fail-fast: false
      matrix:
        example:
          - workspace
          - install
          - setup
          - shared
          - backup
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Add local tools to PATH
        shell: bash
        run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Set up OpenClaw
        uses: tanaabased/actions/setup-openclaw@v1
        with:
          agent-system: github:tanaabased/openclaw-agent-system#main
      - name: Set up Bun
        uses: tanaabased/actions/setup-bun@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Refresh Homebrew when needed
        shell: bash
        run: HOMEBREW_NO_AUTO_UPDATE= brew update-if-needed
      - name: Run Leia-backed example
        shell: bash
        env:
          NO_COLOR: '1'
          OP_SERVICE_ACCOUNT_TOKEN: ${{ matrix.example != 'shared' && secrets.EMORIKEY || '' }}
          TMPDIR: ${{ github.workspace }}/examples/${{ matrix.example }}/.tmp
        run: |
          mkdir -p "$TMPDIR"
          # Preserve the action-installed OpenClaw's position on PATH.
          leia "examples/${{ matrix.example }}/README.md" --retry 0
      - name: RUNNING A LEVEL THREE DIAGNOSTICS
        if: failure()
        shell: bash
        run: |
          if [[ -d "${OPENCLAW_WORKSPACE:-}" ]]; then
            openclaw-diagnostics
          else
            echo "No OpenClaw workspace was created; see the scenario failure output above."
          fi
      - name: Report install and Gateway diagnostics
        if: ${{ always() && (matrix.example == 'install' || matrix.example == 'setup') }}
        continue-on-error: true
        shell: bash
        env:
          TMPDIR: ${{ github.workspace }}/examples/${{ matrix.example }}/.tmp
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.EMORIKEY }}
        run: |
          for report in "$TMPDIR"/*install.json; do
            test -f "$report" || continue
            printf '\n::group::%s\n' "$(basename "$report")"
            jq '{
              outcomes: [.outcomes[]? | {component, stepId, status, code}],
              warnings: [.warnings[]? | {component, code}],
              blocked: (.blocked | if . == null then null else {component, code} end),
              unattempted: [.unattempted[]? | {component, stepId, code}],
              diagnostic
            }' "$report" || printf 'Unable to parse %s\n' "$report" >&2
            printf '::endgroup::\n'
          done
          if test -f "$TMPDIR/first-install-gateway.log"; then
            printf '\n::group::Gateway immediately after first install\n'
            cat "$TMPDIR/first-install-gateway.log"
            printf '::endgroup::\n'
          fi
          printf '\n::group::Gateway after scenario cleanup\n'
          openclaw-gateway diagnostics --debug
          printf '::endgroup::\n'
