name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Set up Bun
        uses: tanaabased/actions/setup-bun@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run linter
        run: bun run lint
      - name: Run unit tests
        run: bun run test
      - name: Publish repository
        uses: tanaabased/actions/publish-repo@v1
        with:
          sync-token: ${{ secrets.TANAAB_COAXIUM_INJECTOR }}
