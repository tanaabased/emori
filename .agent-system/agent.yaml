schema-version: 1

agent:
  id: emori
  name: EMORI
  email:
    from-environment: EMAIL
  description: Tanaab co-founder and operating partner.
  avatar: avatars/emori.png
  emoji: 🧙‍♀️

models:
  default:
    model: openai/gpt-6-astra
    effort: high
  low:
    model: openai/gpt-5.6-terra
    effort: medium
  medium:
    model: openai/gpt-5.6-sol
    effort: high
  high:
    model: openai/gpt-6-astra
    effort: high

memory:
  search:
    provider: openai
    model: text-embedding-3-small
    api-key: EMORI_MEMORY_BINDER

environment:
  op: jp5zhxuc67n7uk3wfjgn5t4yam
  set:
    EMORI_SSH_KEY:
      from-op: 'op://2mh2ny4tegbi33yt3furutomzu/id_emori/private key?ssh-format=openssh'
  required:
    - EMAIL
    - GH_TOKEN
    - EMORI_SSH_KEY
    - EMORI_MEMORY_BINDER

git:
  worktrees:
    repositories:
      local:
        emori: ~/tanaab/emori
        canon: ~/tanaab/canon
        openclaw-agent-system: ~/tanaab/openclaw-agent-system
  ssh:
    private-keys:
      from-environment: EMORI_SSH_KEY
  signing:
    key: EMORI_SSH_KEY
    allowed-signers-file: .agent-system/allowed_signers
  policy:
    delete-remote-ref: deny
    force-push: deny

github:
  host: github.com
  username: emoriwan
  token: GH_TOKEN
  ssh-keys:
    key: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAqukphiWCZn3WmdIjDkeI57VMXG7TBPKupC+MfeWn2l'
    title: EMORIKEY1
  ssh-signing-keys:
    key: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAqukphiWCZn3WmdIjDkeI57VMXG7TBPKupC+MfeWn2l'
    title: EMORIDENTITY1
  config:
    git-protocol: ssh
    spinner: disabled
    telemetry: disabled
  notifications:
    assignment-types:
      - issue
    interval-minutes: 5
    approved-actors:
      - login: pirog
        node-id: MDQ6VXNlcjcxMzQyNA==
        operator-owner: true
    allowed-repository-owners:
      - login: tanaabased
        node-id: O_kgDODNGy1g
      - login: pirog
        node-id: MDQ6VXNlcjcxMzQyNA==
      - login: lando
        node-id: MDEyOk9yZ2FuaXphdGlvbjMxNjA1NTg0
  policy:
    releases: deny

setup:
  steps:
    - id: brew-dependencies
      check: [./scripts/setup-brew-dependencies-task.js, check]
      apply:
        command: ./scripts/setup-brew-dependencies-task.js
        args: [apply]
        timeout-seconds: 1800
    - id: canon-checkout
      check: [./scripts/setup-canon-checkout-task.js, check]
      apply:
        command: ./scripts/setup-canon-checkout-task.js
        args: [apply]
        timeout-seconds: 1800
    - id: canon-plugin
      check: [./scripts/setup-canon-plugin-task.js, check]
      apply:
        command: ./scripts/setup-canon-plugin-task.js
        args: [apply]
        timeout-seconds: 1800
    - id: codex-plugin
      check: [./scripts/setup-codex-plugin-task.js, check]
      apply:
        command: ./scripts/setup-codex-plugin-task.js
        args: [apply]
        timeout-seconds: 1800
    - id: imessage-plugin
      check: [./scripts/setup-imessage-plugin-task.js, check]
      apply:
        command: ./scripts/setup-imessage-plugin-task.js
        args: [apply]
        timeout-seconds: 1800
    - id: openclaw-config
      check: [./scripts/setup-openclaw-config-task.js, check]
      apply:
        command: ./scripts/setup-openclaw-config-task.js
        args: [apply]
        timeout-seconds: 1800
