schema-version: 1

debug: true

agent:
  id: emori
  name: EMORI
  runtime: codex
  email:
    from-environment: EMAIL
  description: Tanaab co-founder and operating partner.
  avatar: avatars/emori.png
  emoji: 🧙‍♀️

setup-host:
  file: ./setup-host.yaml

setup-agent:
  file: ./setup-agent.yaml

environment:
  op: jp5zhxuc67n7uk3wfjgn5t4yam
  set:
    EMORI_SSH_KEY:
      from-op: "op://2mh2ny4tegbi33yt3furutomzu/id_emori/private key?ssh-format=openssh"
  required:
    - EMAIL
    - GH_TOKEN
    - EMORI_SSH_KEY
    - EMORI_MEMORY_BINDER
    - GOG_CREDENTIALS_JSON
    - GOG_TOKEN_JSON
    - GOG_KEYRING_PASSWORD

models:
  default:
    model: openai/gpt-6.1-sol
    effort: high
  low:
    model: openai/gpt-6-luna
    effort: medium
  medium:
    model: openai/gpt-6.1-sol
    effort: high
  high:
    model: openai/gpt-6-astra
    effort: high
  routing:
    guidance:
      file: .agent-system/guidance/model-routing.md

memory:
  search:
    provider: openai
    model: text-embedding-3-small
    api-key: EMORI_MEMORY_BINDER

google:
  credential-encoding: base64
  oauth-client: GOG_CREDENTIALS_JSON
  oauth-token: GOG_TOKEN_JSON
  keyring-password: GOG_KEYRING_PASSWORD

git:
  worktrees:
    repositories:
      local:
        canon: ~/tanaab/canon
        emori: ~/tanaab/emori
        openclaw-agent-system: ~/tanaab/openclaw-agent-system
        smutlord: ~/tanaab/smutlord
  ssh:
    private-keys:
      from-environment: EMORI_SSH_KEY
  signing:
    key: EMORI_SSH_KEY
    allowed-signers-file: .agent-system/allowed_signers
  policy:
    delete-remote-ref: deny
    force-push: deny

github:
  host: github.com
  username: emoriwan
  token: GH_TOKEN
  ssh-keys:
    key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAqukphiWCZn3WmdIjDkeI57VMXG7TBPKupC+MfeWn2l"
    title: EMORIKEY1
  ssh-signing-keys:
    key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAqukphiWCZn3WmdIjDkeI57VMXG7TBPKupC+MfeWn2l"
    title: EMORIDENTITY1
  config:
    git-protocol: ssh
    spinner: disabled
    telemetry: disabled
  schema-version: 3
  runtimes:
    - openclaw
  allowed-repository-owners:
    - org: tanaabased
      node-id: O_kgDODNGy1g
    - login: pirog
      node-id: MDQ6VXNlcjcxMzQyNA==
    - org: lando
      node-id: MDEyOk9yZ2FuaXphdGlvbjMxNjA1NTg0
  issue-assignment:
    allowed:
      - "@pirog"
      - "@emoriwan"
      - "@tanaabot"
    reviewers:
      - "@pirog"
      - "@smutlord"
    assessment:
      guidance:
        file: .agent-system/guidance/assessment.md
    implementation:
      guidance: |
        Deliver the smallest coherent change that achieves the authorized outcome, handling directly coupled integration and usability details and verifying the intended path.
        Treat user documentation as a deliberate deliverable, not a PR-completeness ritual. Default to no documentation change: user-visible behavior alone does not establish a reader need.
        Add or revise user documentation only when verified behavior makes existing instructions false or incomplete, or creates a concrete information gap that could block or materially mislead a reader completing setup, operation, recovery, migration, or a consequential decision. Explicit user requests and repository requirements remain in scope; an approved plan is not, by itself, evidence of a reader need.
        Before editing, identify the affected reader, the task or decision, the exact missing or incorrect instruction, and its authoritative existing home. Make the smallest targeted correction there; create a new document only when that need cannot be served clearly in an existing home.
        Keep implementation rationale, internal architecture, code walkthroughs, and test or validation narration in the plan, PR, or work report—not user documentation. Do not add a changelog or guide merely to describe implementation unless the repository requires it or the change creates a real reader need.
        Preserve necessary prerequisites, defaults, consequential limitations, recovery steps, and useful reference detail. If no concrete reader/action gap is established, make no user-documentation change.
        Resolve routine obstacles independently; avoid incidental cleanup, speculative abstractions, or expanded scope. Surface consequential decisions and distinguish implemented, verified, deployed, and unresolved results.
    feedback:
      skill: emori-reply
  policy:
    releases: allow

backup:
  output: .agent-system/backups
  git-ignore: true
  openclaw-state: required
  include:
    - "{MEMORY,DREAMS,BOOTSTRAP}.md"
    - memory/**
    - .private/**

automations:
  - id: backup-agent-nightly
    display-name: "💾 BACKUP AGENT NIGHTLY"
    enabled: true
    runtimes:
      - openclaw
    schedule:
      cron: "0 4 * * *"
      timezone: America/New_York
    run:
      - bun
      - scripts/backup-drive-task.js
    timeout-seconds: 3600
