schema-version: 1

debug: true

agent:
  id: emori
  name: EMORI
  runtime: codex
  email:
    from-environment: EMAIL
  description: Tanaab co-founder and operating partner.
  avatar: avatars/emori.png
  emoji: 🧙‍♀️

setup-host:
  file: ./setup-host.yaml

setup-agent:
  file: ./setup-agent.yaml

environment:
  op: jp5zhxuc67n7uk3wfjgn5t4yam
  set:
    EMORI_SSH_KEY:
      from-op: "op://2mh2ny4tegbi33yt3furutomzu/id_emori/private key?ssh-format=openssh"
  required:
    - EMAIL
    - GH_TOKEN
    - EMORI_SSH_KEY
    - EMORI_MEMORY_BINDER
    - GOG_CREDENTIALS_JSON
    - GOG_TOKEN_JSON
    - GOG_KEYRING_PASSWORD

models:
  default:
    model: openai/gpt-6.1-sol
    effort: high
  low:
    model: openai/gpt-6-luna
    effort: medium
  medium:
    model: openai/gpt-6.1-sol
    effort: high
  high:
    model: openai/gpt-6-astra
    effort: high
  routing:
    guidance:
      file: guidance/model-routing.md

memory:
  search:
    provider: openai
    model: text-embedding-3-small
    api-key: EMORI_MEMORY_BINDER

google:
  credential-encoding: base64
  oauth-client: GOG_CREDENTIALS_JSON
  oauth-token: GOG_TOKEN_JSON
  keyring-password: GOG_KEYRING_PASSWORD

git:
  worktrees:
    repositories:
      local:
        canon: ~/tanaab/canon
        emori: ~/tanaab/emori
        openclaw-agent-system: ~/tanaab/openclaw-agent-system
        smutlord: ~/tanaab/smutlord
  ssh:
    private-keys:
      from-environment: EMORI_SSH_KEY
  signing:
    key: EMORI_SSH_KEY
    allowed-signers-file: .agent-system/allowed_signers
  policy:
    delete-remote-ref: deny
    force-push: deny

github:
  host: github.com
  username: emoriwan
  token: GH_TOKEN
  ssh-keys:
    key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAqukphiWCZn3WmdIjDkeI57VMXG7TBPKupC+MfeWn2l"
    title: EMORIKEY1
  ssh-signing-keys:
    key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAqukphiWCZn3WmdIjDkeI57VMXG7TBPKupC+MfeWn2l"
    title: EMORIDENTITY1
  config:
    git-protocol: ssh
    spinner: disabled
    telemetry: disabled
  schema-version: 3
  runtimes:
    - openclaw
  routing:
    - "tanaabased/*"
    - "pirog/me"
    - "lando/*"
  issue-pickup:
    projects:
      - repository: tanaabased/openclaw-agent-system
        milestone:
          number: 14
          policy: only
  issue-assignment:
    allowed:
      - "@pirog"
      - "@emoriwan"
      - "@tanaabot"
    reviewers:
      - "@pirog"
      - "@smutlord"
    assessment:
      guidance:
        file: guidance/assessment.md
    implementation:
      guidance:
        file: guidance/implementation.md
    feedback:
      skill: emori-reply
  policy:
    releases: allow

backup:
  output: .agent-system/backups
  git-ignore: true
  openclaw-state: required
  include:
    - "{MEMORY,DREAMS,BOOTSTRAP}.md"
    - memory/**
    - .private/**

automations:
  file: ./automations.yml
