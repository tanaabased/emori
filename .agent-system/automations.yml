defaults: &defaults
  enabled: true
  runtimes: [openclaw]
  group: REPORTS
  model: low

updates: &updates
  <<: *defaults
  thread:
    id: updates
    name: UPDATES
  timeout-seconds: 1800

automations:
  - <<: *updates
    id: update-shared-sources
    display-name: '⬇️ UPDATE SHARED SOURCES'
    schedule:
      cron: '0 23 * * *'
    run:
      - bun
      - scripts/update-shared-sources-task.js
  - <<: *updates
    id: update-agent
    display-name: '⬇️ UPDATE AGENT'
    schedule:
      cron: '30 23 * * *'
    run:
      - bun
      - scripts/update-agent-task.js
  - <<: *defaults
    id: backup-agent-nightly
    display-name: '💾 BACKUP AGENT NIGHTLY'
    schedule:
      cron: '0 4 * * *'
    run:
      - bash
      - scripts/backup-agent.sh
    thread:
      id: backups
      name: BACKUPS
    timeout-seconds: 3600
