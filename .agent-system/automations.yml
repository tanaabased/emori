defaults: &defaults
  runtimes: [openclaw]
  group: REPORTS
  model: low
  timeout-seconds: 3600

updates: &updates
  <<: *defaults
  thread:
    id: updates
    name: SYSTEM UPDATE

automations:
  - <<: *updates
    id: update-shared-sources
    display-name: '⬇️ UPDATE SHARED SOURCES'
    schedule: '0 23 * * *'
    run:
      - bun
      - scripts/update-shared-sources-task.js
  - <<: *updates
    id: update-agent
    display-name: '⬇️ UPDATE AGENT'
    schedule: '30 23 * * *'
    run:
      - bun
      - scripts/update-agent-task.js
  - <<: *updates
    id: backup-agent
    display-name: '💾 BACKUP AGENT'
    schedule: '1 1 * * *'
    run:
      - bash
      - scripts/backup-agent.sh
